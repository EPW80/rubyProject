plugins:
  - rubocop-rails
  - rubocop-performance
  - rubocop-rspec
  - rubocop-rspec_rails

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - 'db/schema.rb'
    - 'db/migrate/*'
    - 'bin/*'
    - 'tmp/**/*'
    - 'log/**/*'
    - 'vendor/**/*'

# Disable overly strict or project-agnostic rules
Style/Documentation:
  Enabled: false

Metrics/MethodLength:
  Max: 20

Metrics/AbcSize:
  Max: 25

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - 'config/routes.rb'

# Rails-specific
Rails/I18nLocaleTexts:
  Enabled: false

Rails/Exit:
  Exclude:
    - 'spec/rails_helper.rb'

# RSpec: keep the existing lenient philosophy (metrics already relaxed above).
RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/DescribeClass:
  Enabled: false

RSpec/LetSetup:
  Enabled: false

RSpec/ContextWording:
  Enabled: false

# The suite uses implicit `is_expected` one-liners for shoulda matchers.
RSpec/ImplicitSubject:
  Enabled: false

RSpec/NestedGroups:
  Max: 4
